name: Publish verified OhMyCode macOS packages
on:
  push:
    branches: [focus-release]
    paths: [".github/workflows/ohmycode-mac-notes.yml"]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: '44395047937'
      TAG: ohmycode-2.0.24-ohmycode.33-experimental
    steps:
      - name: Verify source and download signed builds
        run: |
          set -euo pipefail
          gh run watch "$BUILD_RUN" --repo "$GH_REPO" || true
          sha=$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq .head_sha)
          test "$sha" = "$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.sha)"
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN/jobs" > jobs.json
          for arch in x64 arm64; do
            jq -e --arg job "mac (macos-26-intel, $arch)" '.jobs[]|select(.name==$job)|[.steps[]|select(.name=="Verify bundled CLI and signature" or .name=="Save test packages only")|.conclusion]==["success","success"]' jobs.json
            gh run download "$BUILD_RUN" --repo "$GH_REPO" --name "ohmycode-macos-test-$arch" --dir "assets/$arch"
            (cd "assets/$arch"; sha256sum -c "SHA256SUMS-macos-$arch.txt")
          done
      - name: Publish experimental downloads
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --prerelease --title "OhMyCode 2.0.24-ohmycode.33 — experimental macOS" --notes 'Исправлены прокрутка и возврат курсора в диалогах. Intel — проверены подпись и запуск ядра. Для Apple Silicon проверены архитектура и подпись. Запуск на M-чипе ещё не проверен. Подпись ad-hoc, без нотариализации Apple.'
          for f in assets/*/*; do
            name=$(basename "$f")
            if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
              mkdir -p verify
              gh release download "$TAG" --pattern "$name" --dir verify
              cmp "$f" "verify/$name"
            else
              gh release upload "$TAG" "$f"
            fi
          done
